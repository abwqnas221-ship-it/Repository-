<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي المجاني للخدمات الرقمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #334155;
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            margin-top: 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>أهلاً بك في منصتي الرقمية</h1>
        <p>موقعك المجاني الأول للربح والخدمات</p>
    </header>

    <main>
        <h2>محتوى الموقع التجريبي</h2>
        <p>هذه الصفحة مهيأة وجاهزة لربطها بشبكات الإعلانات وعرض محتواك أو أدواتك البرمجية للزوار.</p>
        <a href="#" class="btn">اكتشف المزيد</a>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

</body>
</html>
